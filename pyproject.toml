[project]
name = "creative-predictor"
version = "0.1.0"
description = "Agente preditivo de performance de criativos em YouTube Shorts (moda, beleza e automotivo) — Inteli Academy x Galaxies"
authors = [
    { name = "Guilherme Nunes Fernandes e Silva", email = "gnfsemp@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper>=1.2.1",
    "google-api-python-client>=2.200.0",
    "google-genai>=2.25.0",
    "ollama>=0.6.2",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "tenacity>=9.1.4",
    "tqdm>=4.70.1",
    "yt-dlp>=2026.8.19",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
