# Candidatos a canal da base de YouTube Shorts.
#
# Validados por `python -m creative_predictor.collect.channels validate`; os
# aprovados vão para configs/channels.yaml.
#
# Campos: handle (ou channel_id), name, sector (moda | beleza | automotivo),
# region (br | global), kind (marca | criador). Veículos de mídia especializada
# contam como `criador`; lojas que vendem pelo próprio canal, como `marca`.
#
# Critérios objetivos, aplicados pela validação: ao menos 50 Shorts publicados
# na janela de coleta (15/10/2024 a 28/08/2026) e no máximo 30% dos 50 Shorts
# mais recentes com curtidas abaixo de 0,3% das views (sinal de views pagas). `holdout: true` reserva canais ativos abaixo desse
# mínimo para fora do treino (demonstração e avaliação de canais com poucos
# Shorts).
#
# Critério de conteúdo, conferido nos títulos dos Shorts: conteúdo próprio do
# canal, dentro do setor. Saem, com `exclude: <motivo>`, canais de lifestyle,
# reacts, compilações, postagem automática e peças de anúncio.
#
# Ficam aqui só canais oficiais (conferidos pelo título e pela descrição),
# inclusive os reprovados, para registrar que foram considerados. Handles
# inexistentes ou que pertencem a outro canal foram retirados. Marcas cujo canal
# oficial não foi encontrado (os handles óbvios são de canais sem relação com a
# marca): GAC, GWM, Renner, C&A, Shein Brasil.

