# Candidatos a canal da base de YouTube Shorts.
#
# Validados por `python -m creative_predictor.collect.channels validate`; os
# aprovados vão para configs/channels.yaml. Um candidato cortado na revisão
# fica aqui com `exclude: <motivo>`, para a decisão ficar registrada.
#
# Campos: handle (ou channel_id), name, sector (moda | beleza | automotivo),
# region (br | global), kind (marca | criador). Veículos de mídia especializada
# contam como `criador`. `holdout: true` reserva marcas ativas abaixo do
# mínimo de Shorts para a demonstração, fora do treino.
#
# Ficam aqui só canais oficiais (conferidos pelo título e pela descrição),
# inclusive os reprovados pelos critérios, para registrar que foram
# considerados. Handles inexistentes ou que pertencem a outro canal foram
# retirados. Marcas cujo canal oficial não foi encontrado (os handles óbvios
# são de canais sem relação com a marca): GAC, GWM, Renner, Shein Brasil.

