name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Só cancela execuções antigas de PR; pushes em develop/main sempre terminam.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Lock, lint e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Instala dependências (falha se o uv.lock estiver desatualizado)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formatação
        run: uv run ruff format --check .

      - name: Testes
        run: uv run pytest
